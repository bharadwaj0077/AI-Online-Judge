$kind: http-request
name: "Test 5: Create Problem - Happy Path"
method: POST
url: "{{baseUrl}}/api/v1/problems"
description: |-
  Sends POST /problems as an ADMIN with a fully compliant payload.
  Expected: 201 Created — problem is persisted and the response contains `data.publicId` and `data.slug`.

  **Critical:** The afterResponse script dynamically captures `data.publicId` and `data.slug`
  from the response and saves them as collection variables (`problemPublicId`, `problemSlug`)
  so that Tests 6-12 can reference the newly created problem without hardcoding IDs.

  ## Setup
  Ensure you are logged in as an ADMIN account so the `token` cookie is present.
examples: .resources/Test 5 - Create Problem - Happy Path.resources/examples
order: 3000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Two Sum Classic",
      "statement": "Given an array of integers `nums` and an integer `target`, return the indices of the two numbers that add up to `target`. You may assume that each input would have exactly one solution.",
      "inputFormat": "First line: integer N (size of array). Second line: N space-separated integers. Third line: integer target.",
      "outputFormat": "Two space-separated integers representing the 0-based indices.",
      "constraintsText": "2 <= N <= 10^4, -10^9 <= nums[i] <= 10^9, exactly one valid answer exists.",
      "difficulty": "EASY",
      "visibility": "PUBLIC",
      "timeLimitMs": 1000,
      "memoryLimitMb": 256
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Test 5 — Status is 201 Created", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Test 5 — Response has success: true", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
      });

      pm.test("Test 5 — Response data contains publicId", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property("publicId");
          pm.expect(json.data.publicId).to.be.a("string").and.not.empty;
      });

      pm.test("Test 5 — Response data contains slug", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property("slug");
          pm.expect(json.data.slug).to.be.a("string").and.not.empty;
      });

      pm.test("Test 5 — Response data contains title matching payload", function () {
          const json = pm.response.json();
          pm.expect(json.data.title).to.eql("Two Sum Classic");
      });

      pm.test("Test 5 — Response data contains difficulty", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property("difficulty");
          pm.expect(["EASY", "MEDIUM", "HARD"]).to.include(json.data.difficulty);
      });

      pm.test("Test 5 — Response data contains visibility", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property("visibility");
      });

      pm.test("Test 5 — Response data contains timeLimitMs and memoryLimitMb", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property("timeLimitMs");
          pm.expect(json.data).to.have.property("memoryLimitMb");
      });

      // ─── Capture IDs for downstream tests ───────────────────────────────────
      pm.test("Test 5 — Capture publicId and slug as collection variables", function () {
          const json = pm.response.json();
          const publicId = json.data && json.data.publicId;
          const slug     = json.data && json.data.slug;

          pm.expect(publicId, "publicId must be present to seed downstream tests").to.be.a("string").and.not.empty;
          pm.expect(slug,     "slug must be present to seed downstream tests").to.be.a("string").and.not.empty;

          pm.collectionVariables.set("problemPublicId", publicId);
          pm.collectionVariables.set("problemSlug",     slug);

          console.log("[Test 5] Saved problemPublicId:", publicId);
          console.log("[Test 5] Saved problemSlug:",     slug);
      });

      pm.test("Test 5 — Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
