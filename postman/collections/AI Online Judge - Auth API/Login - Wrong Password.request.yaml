$kind: http-request
name: Login - Wrong Password
method: POST
url: "{{baseUrl}}/api/v1/auth/login"
description: Attempts login with correct username but wrong password. Expects 401.
order: 9000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{testUsername}}",
      "password": "WrongPassword999"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
        pm.response.to.have.status(401);
      });

      pm.test("Response has success false", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.be.false;
      });

      pm.test("Error message is generic (no username/password enumeration)", function () {
        const json = pm.response.json();
        pm.expect(json.message).to.include("Invalid username or password");
      });

      pm.test("No token cookie is set on failed login", function () {
        const cookies = pm.cookies.toObject();
        pm.expect(cookies).to.not.have.property("token");
      });
    language: text/javascript
