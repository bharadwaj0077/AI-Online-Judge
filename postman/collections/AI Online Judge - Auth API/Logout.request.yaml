$kind: http-request
method: POST
url: "{{baseUrl}}/api/v1/auth/logout"
description: Logs out the current user by clearing the token cookie. Expects 200.
examples: .resources/Logout.resources/examples
order: 12000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has success true", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });

      pm.test("Token cookie is cleared after logout", function () {
        const cookies = pm.cookies.toObject();
        pm.expect(cookies).to.not.have.property("token");
      });

      pm.test("Response time is under 500ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
