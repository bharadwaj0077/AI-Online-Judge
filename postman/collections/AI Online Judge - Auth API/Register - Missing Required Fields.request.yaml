$kind: http-request
name: Register - Missing Required Fields
method: POST
url: '{{baseUrl}}/api/v1/auth/register'
description: Sends an empty body. Expects 400 validation error for all required fields.
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () {
        pm.response.to.have.status(400);
      });

      pm.test("Response has success false", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.be.false;
      });

      pm.test("Validation errors are present", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("errors");
      });
