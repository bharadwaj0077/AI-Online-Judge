$kind: http-request
method: POST
url: "{{baseUrl}}/api/v1/auth/login"
description: Logs in with valid credentials. Expects 200, JWT cookie set, and user data in response.
examples: .resources/Login - Happy Path.resources/examples
order: 8000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{testUsername}}",
      "password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has success true", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });

      pm.test("Response contains publicId", function () {
        const json = pm.response.json();
        pm.expect(json.data).to.have.property("publicId");
      });

      pm.test("Response contains username", function () {
        const json = pm.response.json();
        pm.expect(json.data.username).to.eql(pm.environment.get("testUsername"));
      });

      pm.test("Response contains role", function () {
        const json = pm.response.json();
        pm.expect(json.data).to.have.property("role");
      });

      pm.test("HttpOnly token cookie is set", function () {
        const cookies = pm.cookies.toObject();
        pm.expect(cookies).to.have.property("token");
      });

      pm.test("Response does NOT expose password or hash", function () {
        const json = pm.response.json();
        pm.expect(json.data).to.not.have.property("passwordHash");
        pm.expect(json.data).to.not.have.property("password");
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
